{% extends "base.html" %}

{% block content %}

<div class="card confirmation-card">

    <div class="confirm-icon">
        !
    </div>

    <h2>
        تأكيد الإرسال
    </h2>

    <p class="description">

        أنت على وشك إرسال

        <strong>
            {{ selected_count }}
        </strong>

        رسالة.

    </p>


    <div class="warning-box">

        سيتم إرسال الرسائل باستخدام حساب Outlook
        المفتوح حالياً على هذا الجهاز.

        <br><br>

        بعد الإرسال لا يمكن التراجع.

    </div>


    <div class="button-row">

        <a
            href="{{ url_for('step5') }}"
            class="secondary-btn"
        >
            إلغاء
        </a>


        <form
            method="POST"
            action="{{ url_for('send_emails') }}"
            class="inline-form"
        >

            <button
                class="primary-btn"
                type="submit"
            >
                📤 نعم، إرسال الآن
            </button>

        </form>

    </div>

</div>

{% endblock %}
